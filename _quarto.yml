project:
  type: book
  output-dir: _book

lang: ja

# 日本語の文中・文間の改行を空白にしない（1文1行で書けるようにする）
filters:
  - filters/ja-linebreak.lua

book:
  title: "Pythonで学ぶ 映像の定量分析入門"
  subtitle: "OpenCVとNumPyで、映像を「測る」"
  author: "深川 大路"
  chapters:
    - index.qmd
    - contents.qmd
    - part: "第I部　準備"
      chapters:
        - chapters/01-structure.qmd
        - chapters/02-setup.qmd
  # 各章は書き上がりしだい、ここに追加していきます。
  page-navigation: true
  search: true
  sidebar:
    style: docked
  page-footer:
    left: "© 2026 Daiji Fukagawa"
    right: "文章と図：[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ja)　コード：[MIT](https://github.com/dfukagaw28/intro-to-quantitative-video-analysis-py/blob/main/LICENSE-CODE)"

format:
  html:
    theme:
      light: [cosmo, styles/book.scss]
      dark: [darkly, styles/book.scss]
    css: styles/cover.css
    toc: true
    toc-title: "このページの内容"
    number-sections: true
    code-copy: true
    include-after-body: includes/copy-prompt.html
    code-line-numbers: false
    highlight-style: github
    fig-cap-location: bottom
    mainfont: "'Noto Sans JP', 'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif"
    monofont: "'Cascadia Code', 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
