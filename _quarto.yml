project:
  type: book
  output-dir: _book
  resources:
    - images/cover/cover.jpg

lang: ja
bibliography: references.bib
csl: styles/apa-ja.csl

# 日本語の文中・文間の改行を空白にしない（1文1行で書けるようにする）
filters:
  - filters/ja-linebreak.lua

book:
  title: "Pythonで学ぶ 映像の定量分析入門"
  subtitle: "OpenCVとNumPyで、映像を「測る」"
  author: "深川 大路"
  chapters:
    - index.qmd
    - contents.qmd
    - part: "第I部　準備"
      chapters:
        - chapters/01-structure.qmd
        - chapters/02-setup.qmd
        - chapters/03-numpy.qmd
        - chapters/04-video.qmd
    - part: "第II部　映像から数値を取り出す"
      chapters:
        - chapters/05-brightness.qmd
        - chapters/06-color.qmd
        - chapters/07-motion.qmd
        - chapters/08-cuts.qmd
    - part: "第III部　作品を分析する"
      chapters:
        - chapters/09-shots.qmd
        - chapters/10-project.qmd
    - references.qmd
  appendices:
    - appendices/a-powershell.qmd
    - appendices/b-ffmpeg.qmd
    - appendices/c-troubleshooting.qmd
    - appendices/d-statistics.qmd
    - appendices/e-functions.qmd
    - appendices/f-samples.qmd
    - appendices/g-copyright.qmd
    - appendices/h-dataframe.qmd
  page-navigation: true
  search: true
  sidebar:
    style: docked
  page-footer:
    left: "© 2026 Daiji Fukagawa"
    right: "文章と図：[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ja)　コード：[MIT](https://github.com/dfukagaw28/intro-to-quantitative-video-analysis-py/blob/main/LICENSE-CODE)"

format:
  html:
    theme:
      light: [cosmo, styles/book.scss]
      dark: [darkly, styles/book.scss]
    css: styles/cover.css
    toc: true
    toc-title: "このページの内容"
    number-sections: true
    code-copy: true
    include-after-body: includes/copy-prompt.html
    code-line-numbers: false
    highlight-style: github
    fig-cap-location: bottom
    mainfont: "'Noto Sans JP', 'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif"
    monofont: "'Cascadia Code', 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
